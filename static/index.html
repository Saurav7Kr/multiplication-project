
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multiplication Table Generator</title>
</head>
<body>
    <h1>My First Live Web Application 🚀</h1>

    <label for="number">Enter a number:</label>
    <input type="number" id="number" value="5">

    <label for="limit">Table up to:</label>
    <input type="number" id="limit" value="10" min="1" max="100">

    <button onclick="generateTable()">Generate Table</button>

    <p id="status"></p>
    <div id="output"></div>

    <script>
        async function generateTable() {
            const number = document.getElementById("number").value;
            const limit = document.getElementById("limit").value;
            const status = document.getElementById("status");
            const output = document.getElementById("output");

            if (number === "" || limit === "") {
                status.textContent = "Please enter both values.";
                return;
            }

            const n = Number(number);
            const max = Number(limit);

            if (!Number.isInteger(n) || !Number.isInteger(max) ||
                n < 0 || max < 1 || max > 100) {
                status.textContent = "Enter a non-negative whole number and a limit from 1 to 100.";
                return;
            }

            status.textContent = "Loading...";
            output.replaceChildren();

            try {
                const response = await fetch(
                    `/api/table/${n}?limit=${max}`
                );

                if (!response.ok) {
                    throw new Error("The server returned an error.");
                }

                const data = await response.json();

                const heading = document.createElement("h2");
                heading.textContent = `Table of ${data.number}`;
                output.appendChild(heading);

                const list = document.createElement("ul");

                data.table.forEach((item) => {
                    const row = document.createElement("li");
                    row.textContent =
                        `${data.number} × ${item.multiplier} = ${item.result}`;
                    list.appendChild(row);
                });

                output.appendChild(list);
                status.textContent = "Table generated successfully!";

            } catch (error) {
                status.textContent = "Could not connect to the server.";
                console.error(error);
            }
        }
    </script>
</body>
</html>
